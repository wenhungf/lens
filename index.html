<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>InkQuest LENS</title>
<meta name="description" content="LENS, an InkQuest magazine: contemporary topics in short, graphic issues, with an EN / EN + 中文 switch.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,100;1,9..144,400,100&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f6f1e7;--card:#fffdf8;--ink:#2b2723;--ink2:#615a52;--sage:#8ba48a;--sage-d:#4f6b54;--terra:#c4673f;--rule:#e2d8c6}
  *{box-sizing:border-box} html,body{background:var(--paper)!important;margin:0}
  body{color:var(--ink);font-family:"DM Sans",Arial,sans-serif;line-height:1.6;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
  header{max-width:980px;margin:0 auto;text-align:center;padding:48px 0 26px;border-bottom:1px solid var(--ink)}
  header small{display:block;font-weight:700;font-size:12px;letter-spacing:.42em;color:var(--sage-d)}
  header h1{margin:8px 0 0;font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(72px,16vw,150px);line-height:.85;letter-spacing:.14em;margin-left:.14em}
  header p{margin:14px 0 0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:20px;color:var(--ink2)}
  main{max-width:980px;margin:0 auto;padding:34px 0 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 24px}
  a.issue{text-decoration:none;color:var(--ink);display:grid;gap:10px}
  a.issue img{width:100%;aspect-ratio:544/784;object-fit:cover;border-radius:3px;box-shadow:0 10px 26px rgba(43,39,35,.22);transition:transform .25s}
  a.issue:hover img{transform:translateY(-4px)}
  a.issue b{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:22px;line-height:1.15}
  a.issue span{font-weight:700;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--terra)}
  a.issue p{margin:0;font-size:15px;color:var(--ink2)}
  footer{max-width:980px;margin:0 auto;border-top:1px solid var(--rule);padding:18px 0 40px;font-size:13px;color:var(--ink2)}
</style>
</head>
<body>
<header><small>InkQuest</small><h1>LENS</h1><p>Big topics, short reads, a closer look.</p></header>
<main>
  <a class="issue" href="issue-01/"><img src="covers/lens-01.jpg" alt="LENS No. 01 cover: a young singer on stage under two spotlights"><span>No. 01 · November 2026</span><b>How young is too young?</b><p>K-pop, teenage idols and the people watching them.</p></a>
</main>
<footer>© 2026 Wen-Hung Fang · InkQuest. LENS is an InkQuest magazine.</footer>
</body>
</html>
